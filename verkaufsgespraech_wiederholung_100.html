<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verkaufsgespr&auml;ch &ndash; Wiederholung mit 100 Aufgaben</title>
<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#1d2733;--m:#5b6877;--l:#d9e0e8;--ok:#1b7a3d;--okb:#e3f4e9;--bad:#b3261e;--badb:#fbe9e7;--acc:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--c:#1d232b;--t:#e6ebf0;--m:#9aa7b5;--l:#33404d;--ok:#5cc47b;--okb:#1f3a2a;--bad:#ff8a80;--badb:#3d2220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:14px 16px 6px;max-width:900px;margin:auto}
h1{font-size:21px;margin:0 0 2px}
.sub{color:var(--m);font-size:14px}
#stat{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--l);padding:8px 16px}
#stat .in{max-width:900px;margin:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
#bar{flex:1;min-width:120px;height:8px;background:var(--l);border-radius:4px;overflow:hidden}
#barf{height:100%;width:0;background:var(--acc);transition:width .3s}
nav{max-width:900px;margin:10px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:8px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{color:#fff;border-color:transparent}
nav button .d{font-size:11px;opacity:.85;display:block}
main{max-width:900px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--c);border:1px solid var(--l);border-left-width:5px;border-radius:10px;padding:12px 14px;margin:0 0 12px}
.nr{font-size:12.5px;color:var(--m);margin-bottom:4px}
.q{font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:7px}
button.o{text-align:left;border:1px solid var(--l);background:var(--bg);color:var(--t);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}
button.o:hover:not(:disabled){border-color:var(--acc)}
button.o.ok{background:var(--okb);border-color:var(--ok)}
button.o.bad{background:var(--badb);border-color:var(--bad)}
button.o:disabled{cursor:default}
.rf{display:flex;gap:8px}.rf button.o{flex:1;text-align:center}
.fb{display:none;margin-top:9px;padding:8px 10px;border-radius:8px;font-size:14.5px}
.fb.show{display:block}.fb.ok{background:var(--okb)}.fb.bad{background:var(--badb)}
.rl{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0}
.rl .chip{border:1px dashed var(--m);border-radius:8px;padding:5px 9px;font-size:14px;min-height:30px}
.rl .chip.f{border-style:solid;background:var(--okb)}
.ab{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.big{font-size:34px;font-weight:700}
.pb{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.pbw{height:10px;background:var(--l);border-radius:5px;overflow:hidden}.pbf{height:100%}
@media(max-width:560px){.pb{grid-template-columns:96px 1fr 46px}}
.wl{margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--badb);cursor:pointer;font-size:14px}

<main id="main"></main>
<script>
(function(){
"use strict";
var T=[{"p": "kontakt", "t": "mc", "f": "Ein Kunde betrachtet l\u00e4ngere Zeit eine Handtasche und streicht mit der Hand \u00fcber das Leder. Welche Ansprachetechnik passt am besten?", "o": ["Ansprache \u00fcber die Ware", "Ansprache \u00fcber den Namen", "Offene Ansprache", "Ansprache \u00fcber eine Dienstleistung"], "l": "Der Kunde zeigt klares Interesse an einem bestimmten Artikel. Genau dort kn\u00fcpfst du an, zum Beispiel mit einer Neuheit oder einer weiteren Farbe.", "id": 1}, {"p": "kontakt", "t": "mc", "f": "Welche Ansprache ist ein Beispiel f\u00fcr die Ansprache \u00fcber den Namen?", "o": ["\u201eGuten Morgen, Frau Berger \u2013 sch\u00f6n, Sie wiederzusehen.\u201c", "\u201eDieses Modell ist gerade neu hereingekommen.\u201c", "\u201eBei dem Wetter brauchen Sie sicher etwas Wasserdichtes.\u201c", "\u201eM\u00f6chten Sie einen Einkaufskorb?\u201c"], "l": "Der Name schafft sofort N\u00e4he. Er funktioniert nur bei Stammkunden, deren Namen du sicher kennst.", "id": 2}, {"p": "kontakt", "t": "mc", "f": "Eine Kundin kommt mit drei schweren T\u00fcten herein und schaut sich suchend um. Welche Technik eignet sich besonders?", "o": ["Ansprache \u00fcber eine Dienstleistung", "Ansprache \u00fcber den Namen", "Ansprache \u00fcber die Ware", "Offene Ansprache"], "l": "Wer beladen oder unsicher wirkt, freut sich \u00fcber eine echte Hilfe, zum Beispiel: \u201eSoll ich Ihnen die T\u00fcten abnehmen?\u201c Das senkt die Hemmschwelle.", "id": 3}, {"p": "kontakt", "t": "rf", "f": "\u201eKann ich Ihnen helfen?\u201c ist eine geschlossene Frage. Der Kunde kann mit einem kurzen \u201eNein danke, ich schaue nur\u201c abwinken.", "a": true, "l": "Richtig. Damit ist das Gespr\u00e4ch beendet, bevor es begonnen hat. Besser sind Techniken, die kein schnelles Nein zulassen.", "id": 4}, {"p": "kontakt", "t": "rf", "f": "Die Ansprache \u00fcber den Namen eignet sich besonders f\u00fcr Kunden, die zum ersten Mal im Gesch\u00e4ft sind.", "a": false, "l": "Falsch. Den Namen kennst du nur bei Stammkunden. Bei Erstkunden w\u00e4hlst du eine andere Technik.", "id": 5}, {"p": "kontakt", "t": "mc", "f": "Wann ist die offene Ansprache besonders sinnvoll?", "o": ["Wenn der Kunde erkennbar erst in Ruhe schauen m\u00f6chte", "Wenn der Kunde einen bestimmten Artikel in der Hand h\u00e4lt", "Wenn du den Namen des Kunden kennst", "Wenn der Kunde sichtbar schwere Taschen tr\u00e4gt"], "l": "Du gr\u00fc\u00dft freundlich, zeigst Bereitschaft und l\u00e4sst dem Kunden Raum. Danach bleibst du in Sichtweite.", "id": 6}, {"p": "kontakt", "t": "lue", "f": "\u201eKann ich Ihnen helfen?\u201c und \u201eSuchen Sie etwas Bestimmtes?\u201c sind ___ Fragen. Der Kunde kann einfach mit \u201eNein\u201c antworten.", "o": ["geschlossene", "offene", "suggestive", "alternative"], "l": "Geschlossene Fragen lassen sich mit Ja oder Nein beantworten. Deshalb eignen sie sich nicht als Einstieg.", "id": 7}, {"p": "kontakt", "t": "mc", "f": "Welches Verhalten in der Kontaktphase ist ein Fehler?", "o": ["W\u00e4hrend der Begr\u00fc\u00dfung weiter aufs Handy schauen", "Auf die Tageszeit passend gr\u00fc\u00dfen", "Die T\u00e4tigkeit unterbrechen und sich dem Kunden zuwenden", "Blickkontakt aufnehmen"], "l": "Das Handy in der Hand sagt: Etwas anderes ist mir wichtiger als du. K\u00f6rpersprache wirkt st\u00e4rker als Worte.", "id": 8}, {"p": "kontakt", "t": "mc", "f": "Der Blick eines Kunden wandert suchend durch die Abteilung. Welcher Satz ist eine situative Ansprache?", "o": ["\u201eSie schauen sich um \u2013 suchen Sie eine bestimmte Abteilung?\u201c", "\u201eGuten Tag, Herr Kalina!\u201c", "\u201eDas Rad ist gerade neu in die Kollektion gekommen.\u201c", "\u201eM\u00f6chten Sie einen Einkaufskorb?\u201c"], "l": "Du greifst auf, was du siehst: hier den suchenden Blick. Das wirkt aufmerksam statt einstudiert.", "id": 9}, {"p": "kontakt", "t": "rf", "f": "Nach einer offenen Ansprache bleibst du in Sichtweite und beobachtest, wann der Kunde Hilfe braucht.", "a": true, "l": "Richtig. Die offene Ansprache ist kein Freibrief zum Verschwinden. Du bleibst verf\u00fcgbar, ohne aufdringlich zu sein.", "id": 10}, {"p": "kontakt", "t": "rf", "f": "Bei der situativen Ansprache sind auch Bemerkungen zum Aussehen des Kunden erlaubt, wenn sie freundlich gemeint sind.", "a": false, "l": "Falsch. Bleibe sachlich und beziehe dich auf Sichtbares wie Wetter oder Gep\u00e4ck. Bemerkungen zum Aussehen sind tabu.", "id": 11}, {"p": "bedarf", "t": "mc", "f": "Welche Frage ist eine offene Frage?", "o": ["\u201eWof\u00fcr m\u00f6chten Sie die Jacke haupts\u00e4chlich nutzen?\u201c", "\u201eSoll die Jacke denn auch eine Kapuze haben?\u201c", "\u201eM\u00f6chten Sie sie in Blau oder in Schwarz?\u201c", "\u201eIst Ihnen ein niedriger Preis wichtig?\u201c"], "l": "Offene Fragen beginnen mit einem W-Wort und lassen sich nicht mit Ja oder Nein beantworten. Sie liefern die meisten Informationen.", "id": 12}, {"p": "bedarf", "t": "mc", "f": "Was kennzeichnet eine geschlossene Frage?", "o": ["Sie l\u00e4sst sich nur mit Ja oder Nein beantworten.", "Sie beginnt immer mit einem W-Wort.", "Sie gibt dem Kunden zwei M\u00f6glichkeiten zur Auswahl.", "Sie fragt nach dem Grund hinter einem Wunsch."], "l": "Geschlossene Fragen eignen sich zum Festlegen von Einzelheiten, nicht f\u00fcr den Gespr\u00e4chsanfang.", "id": 13}, {"p": "bedarf", "t": "mc", "f": "\u201eM\u00f6chten Sie die Jacke eher sportlich oder eher klassisch?\u201c Welche Frageart ist das?", "o": ["Alternativfrage", "Motivfrage", "Kontrollfrage", "Suggestivfrage"], "l": "Du gibst zwei M\u00f6glichkeiten vor, zwischen denen der Kunde w\u00e4hlt. Das grenzt die Auswahl ein.", "id": 14}, {"p": "bedarf", "t": "mc", "f": "\u201eWas st\u00f6rt Sie an Ihren jetzigen Schuhen?\u201c Welche Frageart ist das?", "o": ["Motivfrage", "Kontrollfrage", "Geschlossene Frage", "Suggestivfrage"], "l": "Die Motivfrage fragt nach dem Grund hinter dem Wunsch. So erkennst du das Kaufmotiv.", "id": 15}, {"p": "bedarf", "t": "mc", "f": "\u201eSie m\u00f6chten doch sicher etwas Hochwertiges?\u201c Warum sollte man diese Frageart im Verkauf meiden?", "o": ["Sie legt dem Kunden die Antwort in den Mund.", "Sie ist zu lang und f\u00fcr den Kunden unverst\u00e4ndlich.", "Sie bietet dem Kunden viel zu viele Alternativen an.", "Sie sichert nur ab, was der Kunde schon gesagt hat."], "l": "Das ist eine Suggestivfrage. Kunden durchschauen sie und f\u00fchlen sich manipuliert.", "id": 16}, {"p": "bedarf", "t": "mc", "f": "\u201eHabe ich Sie richtig verstanden: Sie suchen etwas Wasserdichtes f\u00fcrs Radfahren?\u201c Welche Frageart ist das?", "o": ["Kontrollfrage", "Alternativfrage", "Motivfrage", "Offene Frage"], "l": "Die Kontrollfrage sichert ab, ob du den Kunden richtig verstanden hast. Sie steht am Ende der Bedarfsermittlung.", "id": 17}, {"p": "bedarf", "t": "reih", "f": "Bringe die Fragearten in die richtige Reihenfolge (Trichtertechnik, vom Weiten ins Enge).", "o": ["Offene Fragen", "Alternativfragen", "Geschlossene Fragen", "Kontrollfrage"], "l": "Erst \u00f6ffnen, dann schlie\u00dfen: offene Fragen zum Erkunden, Alternativfragen zum Eingrenzen, geschlossene Fragen f\u00fcr Einzelheiten, zum Schluss die Kontrollfrage.", "id": 18}, {"p": "bedarf", "t": "rf", "f": "Bei Alternativfragen sollte man mindestens f\u00fcnf M\u00f6glichkeiten zur Auswahl anbieten, damit der Kunde sich frei entscheiden kann.", "a": false, "l": "Falsch. Nur zwei Alternativen anbieten. Bei drei oder mehr entsteht Entscheidungsstress.", "id": 19}, {"p": "bedarf", "t": "rf", "f": "Viele offene Fragen hintereinander k\u00f6nnen wie ein Verh\u00f6r wirken. Deshalb fasst man zwischendurch zusammen.", "a": true, "l": "Richtig. Zusammenfassen zeigt Interesse und macht das Gespr\u00e4ch rund.", "id": 20}, {"p": "bedarf", "t": "lue", "f": "Die Reihenfolge \u201evom Weiten ins Enge\u201c bei der Bedarfsermittlung nennt man ___.", "o": ["Trichtertechnik", "Sandwich-Methode", "Bumerang-Methode", "Argumentkette"], "l": "Wie ein Trichter: oben weit mit offenen Fragen, unten eng mit geschlossenen Fragen und einer Kontrollfrage.", "id": 21}, {"p": "bedarf", "t": "mc", "f": "Eine Kundin sagt: \u201eIch brauche irgendwie neue Schuhe.\u201c Welche Frage ist als n\u00e4chster Schritt am besten?", "o": ["\u201eWof\u00fcr m\u00f6chten Sie die Schuhe haupts\u00e4chlich nutzen?\u201c", "\u201eHaben Sie denn Schuhgr\u00f6\u00dfe 40?\u201c", "\u201eSie wollen doch sicher etwas G\u00fcnstiges?\u201c", "\u201eSuchen Sie etwas Bestimmtes?\u201c"], "l": "Am Anfang erkundest du mit einer offenen Frage. Die Gr\u00f6\u00dfe kl\u00e4rst du sp\u00e4ter mit einer geschlossenen Frage.", "id": 22}, {"p": "bedarf", "t": "mc", "f": "Wann setzt man geschlossene Fragen in der Bedarfsermittlung sinnvoll ein?", "o": ["Gegen Ende, um Einzelheiten festzulegen", "Immer gleich zu Beginn des Gespr\u00e4chs", "Immer statt der offenen Fragen", "Nur wenn der Kunde schweigt"], "l": "Wer mit geschlossenen Fragen beginnt, erf\u00e4hrt kaum etwas. Zum Festlegen am Ende sind sie genau richtig.", "id": 23}, {"p": "vorlage", "t": "mc", "f": "Was bedeutet \u201ebedarfsgerechte Auswahl\u201c bei der Warenvorlage?", "o": ["Nur Ware vorlegen, die zum ermittelten Bedarf passt", "Zuerst die teuerste Ware zeigen", "M\u00f6glichst viele Artikel der Abteilung zeigen", "Die Ware zeigen, die gerade am meisten Lagerplatz braucht"], "l": "Die Warenvorlage kn\u00fcpft an die Bedarfsermittlung an. Was der Kunde nicht braucht, wird nicht gezeigt.", "id": 24}, {"p": "vorlage", "t": "mc", "f": "Welcher Fehler passiert bei der Warenvorlage am h\u00e4ufigsten?", "o": ["Zu viel Ware auf einmal zeigen", "Dem Kunden die Ware in die Hand geben", "Die Ware sauber und geordnet zeigen", "Dem Kunden Zeit zum Betrachten lassen"], "l": "F\u00fcnf oder sechs Artikel gleichzeitig \u00fcberfordern den Kunden. Die Entscheidung f\u00e4llt schwerer, nicht leichter.", "id": 25}, {"p": "vorlage", "t": "lue", "f": "Wenn ein Kunde durch zu viel vorgelegte Ware \u00fcberfordert wird, spricht man von ___.", "o": ["Reiz\u00fcberflutung", "Kaufsignal", "Zusatzverkauf", "Vorwegnahme"], "l": "Die Auswahl wird auf zwei bis drei passende Artikel beschr\u00e4nkt. Reicht das nicht, kann man nach einer ersten Reaktion weitere zeigen.", "id": 26}, {"p": "vorlage", "t": "rf", "f": "Bei erkl\u00e4rungsbed\u00fcrftigen oder technischen Artikeln bietet sich an, die Ware vorzuf\u00fchren und ausprobieren zu lassen.", "a": true, "l": "Richtig. Der Kunde erlebt die Funktion selbst und muss sie nicht nur glauben.", "id": 27}, {"p": "vorlage", "t": "rf", "f": "Eine misslungene Vorf\u00fchrung schadet nicht, weil der Kunde ohnehin nur auf den Preis achtet.", "a": false, "l": "Falsch. Eine unsichere oder misslungene Vorf\u00fchrung schadet mehr, als sie nutzt. Deshalb vorher \u00fcben.", "id": 28}, {"p": "vorlage", "t": "mc", "f": "Eine Verk\u00e4uferin legt zwei Jacken auf den Tisch und erkl\u00e4rt beide gleichzeitig. Welche Technik wird dabei verletzt?", "o": ["Auswahl begrenzen und strukturieren", "Ware in die Hand geben", "Ruhe und Zeit lassen", "Blickkontakt zur Ware lenken"], "l": "Wer mehrere Artikel gleichzeitig erkl\u00e4rt, verliert den \u00dcberblick des Kunden. Ordne die Ware und erkl\u00e4re nacheinander.", "id": 29}, {"p": "vorlage", "t": "mc", "f": "\u201eNehmen Sie ihn ruhig einmal in die Hand.\u201c Welche Technik der Warenvorlage ist das?", "o": ["Ware in die Hand geben", "Vorf\u00fchren und ausprobieren lassen", "Blickkontakt zur Ware lenken", "Auswahl begrenzen und strukturieren"], "l": "Der Kunde fasst die Ware selbst an, statt sie nur beschrieben zu bekommen.", "id": 30}, {"p": "vorlage", "t": "lue", "f": "Bei der Technik \u201eRuhe und Zeit lassen\u201c darf die Pause nicht zu ___ werden. Nach kurzer Zeit fragst du aktiv nach dem ersten Eindruck.", "o": ["lang", "kurz", "laut", "teuer"], "l": "Der Kunde soll in Ruhe schauen k\u00f6nnen, aber nicht allein gelassen werden.", "id": 31}, {"p": "vorlage", "t": "mc", "f": "Ein Kunde w\u00fcnscht sich etwas Leichtes und Wasserdichtes. Was legst du vor?", "o": ["Zwei Modelle, die beide Eigenschaften erf\u00fcllen", "Alle Modelle in verschiedenen Farben", "Die Neuheiten, unabh\u00e4ngig von den Eigenschaften", "Nur das teuerste Modell"], "l": "Jeder vorgelegte Artikel muss zum ermittelten Bedarf passen, nicht zu dem, was gerade griffbereit ist.", "id": 32}, {"p": "vorlage", "t": "rf", "f": "Bei zerbrechlicher oder hochwertiger Ware reichst du den Artikel selbst an und weist kurz auf die richtige Handhabung hin.", "a": true, "l": "Richtig. So kann der Kunde die Ware anfassen und du sch\u00fctzt sie zugleich.", "id": 33}, {"p": "vorlage", "t": "mc", "f": "Ein Verk\u00e4ufer wirft dem Kunden die Ware achtlos \u00fcber den Verkaufstisch zu. Welche Wirkung hat das?", "o": ["Die Ware wirkt weniger wertvoll.", "Der Kunde f\u00fchlt sich besonders umsorgt.", "Der Kunde entscheidet sich dadurch schneller.", "Es hat keine Wirkung auf den Kunden."], "l": "Wie du einen Artikel pr\u00e4sentierst, sagt schon etwas \u00fcber seinen Wert.", "id": 34}, {"p": "grunds", "t": "mc", "f": "Welcher Grundsatz der Warenvorlage ist das: \u201eEin bereits abgelehntes Modell wird sofort zur Seite ger\u00e4umt.\u201c", "o": ["4. Sachgem\u00e4\u00dfer Umgang mit der Ware", "2. Der richtige Artikel", "6. Sinnesbezogene Warenvorlage", "1. Der richtige Zeitpunkt"], "l": "Das schafft \u00dcbersicht und erspart sp\u00e4teres Aufr\u00e4umen. Abgelehnte Artikel nicht einfach liegen lassen.", "id": 35}, {"p": "grunds", "t": "mc", "f": "Ein Verk\u00e4ufer l\u00e4sst den Kunden den Stoff einer Jacke f\u00fchlen, statt nur die Materialbezeichnung zu nennen. Welcher Grundsatz?", "o": ["6. Sinnesbezogene Warenvorlage", "4. Sachgem\u00e4\u00dfer Umgang mit der Ware", "8. Serviceleistungen", "3. Eine angemessene Auswahl"], "l": "Kunden sollen die Ware mit m\u00f6glichst vielen Sinnen erleben: anfassen, ausprobieren, anprobieren.", "id": 36}, {"p": "grunds", "t": "mc", "f": "Zu den neuen Wanderschuhen wird eine passende Impr\u00e4gnierung mit angeboten. Welcher Grundsatz?", "o": ["7. Perspektiven f\u00fcr weitere Verk\u00e4ufe", "8. Serviceleistungen", "5. Die richtige Preislage", "3. Eine angemessene Auswahl"], "l": "Die Warenvorlage bietet Ansatzpunkte f\u00fcr sinnvolle Zusatzverk\u00e4ufe. Der Zusatzartikel muss zum Hauptartikel passen.", "id": 37}, {"p": "grunds", "t": "mc", "f": "Eine Verk\u00e4uferin erw\u00e4hnt aktiv den kostenlosen \u00c4nderungsservice f\u00fcr die Hose. Welcher Grundsatz?", "o": ["8. Serviceleistungen", "7. Perspektiven f\u00fcr weitere Verk\u00e4ufe", "4. Sachgem\u00e4\u00dfer Umgang mit der Ware", "2. Der richtige Artikel"], "l": "Erg\u00e4nzende Serviceleistungen werden aktiv beworben. Das dient der Kundenbindung und grenzt vom Wettbewerb ab.", "id": 38}, {"p": "grunds", "t": "mc", "f": "Ein Verk\u00e4ufer zeigt nur g\u00fcnstige Artikel, weil er selbst sparsam einkauft. Gegen welchen Grundsatz verst\u00f6\u00dft er?", "o": ["5. Die richtige Preislage", "3. Eine angemessene Auswahl", "2. Der richtige Artikel", "1. Der richtige Zeitpunkt"], "l": "Der pers\u00f6nliche Kundennutzen steht im Vordergrund, nicht die eigene Preisvorstellung.", "id": 39}, {"p": "grunds", "t": "mc", "f": "Welcher Richtwert gilt nach den acht Grunds\u00e4tzen f\u00fcr eine angemessene Auswahl?", "o": ["3 bis 5 Angebote", "Genau 1 Angebot", "6 bis 8 Angebote", "Alle vorr\u00e4tigen Angebote"], "l": "Weder zu wenig noch zu viel Ware zeigen. Bei sehr erkl\u00e4rungsbed\u00fcrftigen oder hochpreisigen Artikeln kann auch eine kleinere Auswahl sinnvoll sein.", "id": 40}, {"p": "grunds", "t": "rf", "f": "Nach dem Grundsatz \u201eDer richtige Zeitpunkt\u201c darf Ware auch schon w\u00e4hrend der Bedarfsermittlung gezeigt werden.", "a": true, "l": "Richtig. Die Ware wird entweder w\u00e4hrend oder erst nach der Bedarfsermittlung gezeigt. Wichtig ist, dass sie die Bedarfsermittlung nicht durcheinanderbringt.", "id": 41}, {"p": "grunds", "t": "rf", "f": "Die acht Grunds\u00e4tze beschre aus gibt zwei Jahre Garantie.\u201c", "\u201eDie Garantiedauer liegt bei zwei Jahren.\u201c"], "l": "Beim Sie-Standpunkt formulierst du aus Sicht des Kunden. Es geht um die Perspektive, nicht darum, jeden Satz mit \u201eSie\u201c zu beginnen.", "id": 47}, {"p": "argument", "t": "mc", "f": "Welche Formulierung ist positiv formuliert?", "o": ["\u201eDas kann ich Ihnen bis Freitag besorgen.\u201c", "\u201eDas haben wir leider nicht auf Lager.\u201c", "\u201eDas ist leider ein Problem f\u00fcr uns.\u201c", "\u201eDa m\u00fcssen wir erst einmal nachsehen.\u201c"], "l": "Sage, was geht, nicht was nicht geht.", "id": 48}, {"p": "argument", "t": "mc", "f": "Gore-Tex-Membran \u2013 wasserdicht und atmungsaktiv \u2013 Sie bleiben trocken, ohne zu schwitzen. Welcher Teil ist hier der Nutzen?", "o": ["\u201eSie bleiben trocken, ohne zu schwitzen.\u201c", "\u201eEine Gore-Tex-Membran\u201c", "\u201ewasserdicht und zugleich atmungsaktiv\u201c", "\u201eAtmungsaktive Verarbeitung\u201c"], "l": "Der Nutzen ist der konkrete Vorteil f\u00fcr den Kunden. Das Merkmal ist die Eigenschaft der Ware.", "id": 49}, {"p": "argument", "t": "mc", "f": "Rutschfeste Gummisohle \u2013 guter Halt auf nassem Boden \u2013 \u2026 Welche Aussage ist der Nutzen?", "o": ["\u201eSie gehen auch bei Regen sicher.\u201c", "\u201eRutschfeste Gummisohle\u201c", "\u201eGuter Halt auf nassem Boden\u201c", "\u201eDie Sohle besteht aus Gummi.\u201c"], "l": "Der Nutzen beantwortet die Frage des Kunden: Was habe ich davon?", "id": 50}, {"p": "argument", "t": "rf", "f": "Kunden kaufen vor allem Merkmale. Deshalb sollte man m\u00f6glichst viele technische Daten aufz\u00e4hlen.", "a": false, "l": "Falsch. Kunden kaufen Nutzen, nicht Merkmale. Ein Merkmal allein sagt dem Kunden nichts.", "id": 51}, {"p": "argument", "t": "rf", "f": "Bei der Argumentkette gilt: Weniger ist mehr. Wenige starke Argumente, die zum Bedarf passen, wirken besser als viele.", "a": true, "l": "Richtig. Wer zehn Argumente nennt, entwertet die star sondern der Vorteil.", "id": 57}, {"p": "preis", "t": "mc", "f": "\u201e120 Euro f\u00fcr drei Jahre \u2013 das sind noch nicht einmal 12 Cent am Tag.\u201c Welche Methode ist das?", "o": ["Verkleinerungsmethode", "Differenzmethode", "Additionsmethode", "Multiplikationsmethode"], "l": "Du rechnest den Preis auf einen kleinen Zeitraum herunter. Das geht nur bei langlebigen Artikeln und muss ehrlich gerechnet sein.", "id": 58}, {"p": "preis", "t": "mc", "f": "\u201eDer Unterschied betr\u00e4gt 20 Euro \u2013 daf\u00fcr bekommen Sie die wasserdichte Membran.\u201c Welche Methode ist das?", "o": ["Differenzmethode", "Vergleichsmethode", "Verkleinerungsmethode", "Sandwich-Methode"], "l": "Du sprichst nur \u00fcber den Mehrpreis, nicht \u00fcber den Gesamtpreis. Der Mehrwert muss den Mehrpreis erkennbar rechtfertigen.", "id": 59}, {"p": "preis", "t": "mc", "f": "\u201eIn den 129 Euro sind enthalten: die Jacke, zwei Jahre Garantie, die kostenlose \u00c4nderung der \u00c4rmell\u00e4nge und unser Reparaturservice.\u201c Welche Methode ist das?", "o": ["Additionsmethode", "Multiplikationsmethode", "Vergleichsmethode", "Differenzmethode"], "l": "Du z\u00e4hlst alle Leistungen auf, die im Preis enthalten sind. Nur echte Leistungen nennen, keine Selbstverst\u00e4ndlichkeiten.", "id": 60}, {"p": "preis", "t": "mc", "f": "\u201eSie fahren t\u00e4glich zur Arbeit \u2013 an rund 220 Tagen im Jahr bleiben Sie damit trocken.\u201c Welche Methode ist das?", "o": ["Multiplikationsmethode", "Verkleinerungsmethode", "Additionsmethode", "Sandwich-Methode"], "l": "Du rechnest den Nutzen hoch statt den Preis. Das lohnt sich bei h\u00e4ufiger Nutzung.", "id": 61}, {"p": "preis", "t": "mc", "f": "\u201eDas ist etwa so viel wie zweimal Essen gehen \u2013 daf\u00fcr halten die Schuhe mehrere Jahre.\u201c Welche Methode ist das?", "o": ["Vergleichsmethode", "Differenzmethode", "Multiplikationsmethode", "Additionsmethode"], "l": "Du stellst den Preis neben eine allt\u00e4gliche Ausgabe. Der Vergleich muss zur Lebenswelt des Kunden passen.", "id": 62}, {"p": "preis", "t": "rf", "f": "Der Preis sollte schon fr\u00fch im Gespr\u00e4ch genannt werden, damit sich der Kunde m\u00f6glichst bald darauf einstellen kann.", "a": false, "l": "Falsch. Nenne den Preis erst, wenn der Kunde den Nutzen kennt. Vorher ist er nur eine Zahl ohne Gegenwert.", "id": 63}, {"p": "preis", "t": "rf", "f": "Wer beim Nennen des Preises leiser wird oder sich entschuldigt, signalisiert selbst Zweifel am Wert der Ware.", "a": true, "l": "Richtig. Nenne den Preis klar, deutlich und ohne Z\u00f6gern.", "id": 64}, {"p": "preis", "t": "mc", "f": "Welche Aussage solltest du bei der Preisnennung vermeiden?", "o": ["\u201eDas ist leider nicht ganz billig.\u201c", "\u201eDer Schuh kostet 89 Euro und h\u00e4lt mehrere Jahre.\u201c", "\u201eDas ist der Preis f\u00fcr dieses Modell: 89 Euro.\u201c", "\u201eSie bekommen dazu zwei Jahre Garantie.\u201c"], "l": "W\u00f6rter wie \u201eleider\u201c und \u201enicht ganz billig\u201c zeigen eigene Zweifel und schw\u00e4chen die Ware.", "id": 65}, {"p": "preis", "t": "rf", "f": "Die Verkleinerungsmethode eignet sich besonders f\u00fcr Verbrauchsartikel, die der Kunde schnell aufbraucht.", "a": false, "l": "Falsch. Sie passt zu langlebigen Artikeln. Bei Verbrauchsartikeln wirkt die Rechnung unglaubw\u00fcrdig.", "id": 66}, {"p": "preis", "t": "mc", "f": "Wann eignet sich die Vergleichsmethode besonders?", "o": ["Wenn der Preis f\u00fcr den Kunden abstrakt wirkt", "Wenn viele Leistungen im Preis enthalten sind", "Wenn nur zwei Artikel zur Wahl stehen", "Wenn der Kunde den Artikel nur selten nutzt"], "l": "Der Preis wird neben eine bekannte Ausgabe gestellt und dadurch greifbar.", "id": 67}, {"p": "preis", "t": "lue", "f": "Bei der Sandwich-Methode steht der Preis in der ___ des Satzes, nie am Ende.", "o": ["Mitte", "Einleitung", "Frage", "Klammer"], "l": "Davor und danach steht je ein Nutzenargument. So bleibt der Vorteil als Letztes im Ohr.", "id": 68}, {"p": "einwand", "t": "mc", "f": "Ein Kunde sagt: \u201eDas ist mir zu teuer.\u201c Welche Antwort ist eine Gegenfrage?", "o": ["\u201eWomit vergleichen Sie den Preis denn?\u201c", "\u201eGenau deshalb h\u00e4lt sie auch doppelt so lange.\u201c", "\u201eDas h\u00f6re ich \u00f6fter, die meisten sind zufrieden.\u201c", "\u201eJa, und daf\u00fcr haben Sie f\u00fcnf Jahre Garantie.\u201c"], "l": "Du fragst nach, was genau hinter dem Einwand steckt. Freundlich fragen, nicht wie ein Verh\u00f6r.", "id": 69}, {"p": "einwand", "t": "mc", "f": "Kunde: \u201eDie Jacke ist aber schwer.\u201c Verk\u00e4ufer: \u201eGenau deshalb bleibt sie auch bei Sturm formstabil.\u201c Welche Methode?", "o": ["Bumerang-Methode", "Kompensationsmethode", "Ja-und-Methode", "Zerlegungsmethode"], "l": "Du machst den Einwand zum Kaufargument. Das geht nur, wenn die Umdeutung sachlich stimmt.", "id": 70}, {"p": "einwand", "t": "mc", "f": "Kunde: \u201eDie Pflege ist aufwendig.\u201c Verk\u00e4ufer: \u201eDas stimmt. Daf\u00fcr h\u00e4lt das Material doppelt so lange.\u201c Welche Methode?", "o": ["Kompensationsmethode", "Bumerang-Methode", "Gegenfrage-Methode", "Referenzmethode"], "l": "Du erkennst den Nachteil an und stellst \u00fcberwiegende Vorteile daneben. Die Vorteile m\u00fcssen den Nachteil wirklich aufwiegen.", "id": 71}, {"p": "einwand", "t": "mc", "f": "Kunde: \u201eDas ist mir alles zu kompliziert.\u201c Verk\u00e4ufer: \u201eWas genau \u2013 die Bedienung, die Pflege oder die Garantie?\u201c Welche Methode?", "o": ["Zerlegungsmethode", "Gegenfrage-Methode", "Vorwegnahme", "Bilanzmethode"], "l": "Du teilst den gro\u00dfen Einwand in kleine Teile. Das lohnt sich nur bei wirklich komplexen Einw\u00e4nden.", "id": 72}, {"p": "einwand", "t": "mc", "f": "Kunde: \u201eIch bin mir noch unsicher.\u201c Verk\u00e4ufer: \u201eDas h\u00f6re ich \u00f6fter \u2013 die meisten sind nach ein paar Wochen sehr zufrieden.\u201c Welche Methode?", "o": ["Referenzmethode", "Kompensationsmethode", "Bumerang-Metho   wrong.forEach(function(t){var w=el("div","wl","Aufgabe "+t.id+" ("+phOf(t.p).tab+"): "+t.f);w.addEventListener("click",function(){cur=t.p;show();window.scrollTo(0,0);});c3.appendChild(w);});
  var ab=el("div","ab");
  var b1=el("button","btn","Falsche Aufgaben noch einmal");b1.disabled=!wrong.length;
  b1.addEventListener("click",function(){wrong.forEach(function(t){delete A[t.id];});save();cur=wrong.length?wrong[0].p:"kontakt";show();});
  var b2=el("button","btn g","Alles zur\u00fccksetzen");
  b2.addEventListener("click",function(){if(window.confirm("Wirklich alle Antworten l\u00f6schen und von vorn beginnen?")){A={};save();cur="kontakt";show();}});
  ab.appendChild(b1);ab.appendChild(b2);c3.appendChild(ab);m.appendChild(c3);
}
function show(){markNav();if(cur==="res")showRes();else showPhase(cur);updStat();}
buildNav();show();
})();
